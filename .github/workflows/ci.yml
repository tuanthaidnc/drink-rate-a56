name: NỐT checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: America/Los_Angeles
      - run: npm run build
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/not-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:4173/drink-rate-a56/ && break || sleep 1; done
      - run: npm run test:e2e
        env:
          TEST_OUTPUT: /tmp/not-qa
      - run: node --experimental-strip-types tests/pwa-update.mjs
        env:
          TEST_OUTPUT: /tmp/not-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: /tmp/not-qa
