name: Impeccable interface audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/not-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:4173/drink-rate-a56/ && break || sleep 1; done
      - name: Scan source and the rendered phone viewport
        run: |
          git clone --quiet https://github.com/pbakaus/impeccable.git /tmp/impeccable
          git -C /tmp/impeccable checkout --quiet 02523aec3e4c4580102d996d1b6a71fbe062e03f
          mkdir -p /tmp/not-impeccable
          set +e
          /tmp/impeccable/.agents/skills/impeccable/scripts/impeccable detect --json --viewport 393x852 src/App.tsx src/components/Insights.tsx src/components/motion/kinetic.tsx src/components/DataTools.tsx src/components/animate-ui/primitives.tsx src/kinetic.css http://127.0.0.1:4173/drink-rate-a56/ > /tmp/not-impeccable/detection.json 2> /tmp/not-impeccable/detection.log
          status=$?
          printf '%s\n' "$status" > /tmp/not-impeccable/status.txt
          if [ "$status" -eq 1 ]; then cat /tmp/not-impeccable/detection.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impeccable-evidence
          path: /tmp/not-impeccable
