<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta id="app-theme-color" name="theme-color" content="#0b0d0c" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('not_app_theme_v8') || 'dark';
        var isLight = saved === 'light';
        var color = isLight ? '#ffffff' : '#0b0d0c';
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
        document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
        var meta = document.getElementById('app-theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NỐT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NỐT • Food & Drink</title>
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=16" />
  <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png?v=16" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=16" />
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
